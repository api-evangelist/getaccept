openapi: 3.0.0
info:
  contact:
    email: integrations@getaccept.com
    name: GetAccept API Team
    url: https://app.getaccept.com/api
  description: GetAccept provides a sales enablement platform for sales to design, send, promote, track, and e-sign sales documents, leveraging sales collateral, contract management, proposals, and electronic signatures in one place.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.getaccept.com/terms.html
  title: GetAccept Archive Subscriptions API
  version: '1.6'
servers:
- description: Production endpoint
  url: https://api.getaccept.com/v1
security:
- Oauth2:
  - basic
- Token: []
tags:
- externalDocs:
    url: https://app.getaccept.com/api/#subscriptions
  description: To simplify the process of checking a documents status and make it more efficient in an integrated application, you can enable API Webhooks. Enable webhooks as a user with administrator privileges in the Settings | Integration | Webhooks. We support multiple webhooks for one application. Events will be POSTed to your webhook URLs and should be handled by you. A POST must be answered and your endpoint will need to return a 2xx HTTP. Otherwise, the callback will be considered a failure and will be retried later. Retries will be made after 1, 12, 24, and 48 hours. The sender (or notification_email) will receive an email notification after a failed attempt.
  name: Subscriptions
paths:
  /subscriptions:
    x-ms-notification-content:
      schema:
        $ref: '#/components/schemas/Webhook'
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriptions'
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
      tags:
      - Subscriptions
      description: Receive a list of available subscriptions for the current entity.
      operationId: ListSubscriptions
      summary: List subscriptions
      x-ms-visibility: internal
    post:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: OK
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
      tags:
      - Subscriptions
      description: "This call will create a new subscription.\nThe response will be wrapped in an array even for single object according to REST hook standards.\n\n>Events\n  * `document.created` - Document is created\n  * `document.sent` - Document is sent\n  * `document.viewed` - Document is sent\n  * `document.signed` - Document is signed\n  * `document.approved` - Document is approved\n  * `document.expired` - Document has expired\n  * `document.rejected` - Document is rejected\n  * `document.downloaded` - Document is downloaded\n  * `document.printed` - Document is printed\n  * `document.forwarded` - Document is forwarded\n  * `document.partially_signed` - Document has been partially signed\n  * `document.commented` - Document is commented\n  * `document.hardbounced` - Document is hardbounced\n  * `document.imported` - Document is imported"
      operationId: CreateSubscription
      requestBody:
        content:
          application/json:
            schema:
              properties:
                host:
                  description: The host name to send the post to
                  type: string
                  x-ms-visibility: internal
                event:
                  description: Event trigger
                  enum:
                  - document.created
                  - document.sent
                  - document.viewed
                  - document.reviewed
                  - document.signed
                  - document.approved
                  - document.expired
                  - document.rejected
                  - document.downloaded
                  - document.printed
                  - document.forwarded
                  - document.partially_signed
                  - document.commented
                  - document.hardbounced
                  - document.imported
                  example: document.signed
                  type: string
                  x-ms-dynamic-values:
                    operationId: ListSubscriptionEvents
                    value-path: value
                    value-title: name
                  x-ms-summary: Select event
                  x-ms-visibility: important
                global:
                  default: true
                  description: If the webhook should catch events for all entity users.
                  enum:
                  - true
                  - false
                  example: true
                  nullable: true
                  type: boolean
                  x-ms-summary: All entity users
                notification_email:
                  description: If the event fails, send a notification to this email instead of the sender
                  example: hostmaster@example.com
                  type: string
                  x-ms-summary: Error email
                  x-ms-visibility: advanced
                payload:
                  description: Additional payload data to post
                  type: string
                  x-ms-summary: Payload
                  x-ms-visibility: advanced
                target_url:
                  description: The URL to post payload to on event
                  example: https://abc.x.pipedream.net/
                  type: string
                  x-ms-notification-url: true
                  x-ms-visibility: internal
              required:
              - event
              - target_url
              type: object
        description: A JSON object containing subscription information
        required: true
      summary: Subscribe to document events
      x-ms-summary: When a document status changes
      x-ms-trigger: single
      x-ms-trigger-hint: Trigger when a document status is changed
      x-ms-visibility: important
  /subscriptions/errors:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  properties:
                    created_at:
                      type: string
                    event:
                      type: string
                    payload:
                      type: string
                    result:
                      type: string
                    retry:
                      type: string
                    status:
                      type: string
                    target_url:
                      type: string
                  type: object
                type: array
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
      tags:
      - Subscriptions
      description: Get the last errors for active subscriptions.
      operationId: GetSubscriptionErrors
      summary: Get subscription errors
  /subscriptions/events:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  properties:
                    name:
                      type: string
                    value:
                      type: string
                  type: object
                type: array
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Subscriptions
      description: This call will return a list of available subscription events
      operationId: ListSubscriptionEvents
      summary: List available subscription events
      x-ms-visibility: internal
  /subscriptions/test:
    post:
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
      tags:
      - Subscriptions
      description: Simulate or test a subscription / webhook event.
      operationId: TestSubscription
      requestBody:
        content:
          application/json:
            schema:
              properties:
                document_id:
                  description: The document id to trigger the event for
                  type: string
                event:
                  description: The event to trigger
                  type: string
                recipient_id:
                  description: The recipient to trigger the event for
                  type: string
              required:
              - event
              - document_id
              type: object
        required: true
      summary: Test subscription
  /subscriptions/{subscriptionId}:
    delete:
      parameters:
      - description: Subscription ID
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        x-ms-summary: Subscription ID
        x-ms-url-encoding: single
      responses:
        '204':
          description: No Content
      tags:
      - Subscriptions
      description: Delete a single subscription.
      operationId: DeleteSubscription
      summary: Delete subscription
      x-ms-visibility: internal
    get:
      parameters:
      - description: Subscription ID
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        x-ms-summary: Subscription ID
        x-ms-url-encoding: single
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Subscriptions
      description: This call will return details of a single subscription
      operationId: GetSubscriptionDetails
      summary: Get subscription details
      x-ms-visibility: internal
components:
  schemas:
    Webhook:
      description: Webhook payload
      properties:
        custom_fields:
          additionalProperties:
            type: string
          type: object
          x-ms-summary: Custom Fields
        document:
          $ref: '#/components/schemas/Document'
        entity:
          description: Entity for the webhook
          properties:
            custom_domain:
              description: Custom domain setting for entity
              type: string
              x-ms-summary: Entity custom domain
              x-ms-visibility: advanced
            email_send_message:
              description: Default email message
              type: string
              x-ms-summary: Default email message
              x-ms-visibility: advanced
            email_send_subject:
              description: Default email subject
              type: string
              x-ms-summary: Default email subject
              x-ms-visibility: advanced
            sub_domain:
              description: Sub-domain for the entity
              type: string
              x-ms-summary: Entity sub-domain
              x-ms-visibility: advanced
          type: object
          x-ms-summary: Entity
        event:
          type: string
          x-ms-summary: Event name
        event_action:
          type: string
          x-ms-summary: Event action
        event_type:
          type: string
          x-ms-summary: Event type
        recipient:
          $ref: '#/components/schemas/Recipient'
        subscription_id:
          type: string
          x-ms-summary: Subscription ID
      title: Webhook
      type: object
      x-ms-summary: Webhook
    Error:
      properties:
        description:
          type: string
        error:
          type: string
        status:
          type: number
      title: Error
      type: object
      x-ms-summary: Error
    Subscriptions:
      description: Subscription list
      items:
        $ref: '#/components/schemas/Subscription'
      title: Subscriptions
      type: array
      x-ms-summary: Subscriptions
    Recipient:
      description: Every unique e-mail address (or mobile number) that is connected to a document is a recipient.
      properties:
        company_name:
          description: Company name of the recipient
          type: string
          x-ms-summary: Company name
        company_number:
          description: Company number of the recipient
          type: string
          x-ms-summary: Company number
        document_url:
          description: Unique URL for the recipient to view/sign
          type: string
          x-ms-summary: Document URL
          x-ms-visibility: important
        email:
          description: Email of the recipient
          type: string
          x-ms-summary: Recipient email
        first_name:
          description: First name of the recipient
          type: string
          x-ms-summary: First name
        fullname:
          description: Full name of the recipient
          type: string
          x-ms-summary: Full name
        gender:
          description: Gender of the recipient
          type: string
          x-ms-summary: Gender
          x-ms-visibility: advanced
        id:
          description: ID of the recipient
          type: string
          x-ms-summary: ID
          x-ms-visibility: advanced
        last_name:
          description: Last name of the recipient
          type: string
          x-ms-summary: Last name
        mobile:
          description: Mobile number of the recipient
          type: string
          x-ms-summary: Mobile
        note:
          description: Note of the recipient
          type: string
          x-ms-summary: Note
          x-ms-visibility: advanced
        order_num:
          description: Signing order of the recipient
          type: string
          x-ms-summary: Signing order num
          x-ms-visibility: advanced
        role:
          type: string
          x-ms-visibility: internal
        settings:
          description: Per-recipient signature settings.
          properties:
            exclude_verified_eid_signature:
              description: 'Only applies when the document has external_eid_signature enabled. If true, this recipient may sign with a handwritten signature instead of verifying with a verified EID. Note: the additional non-QES signatures do not degrade the security of the document''s existing QES signatures, but are of a lower assurance level (advanced or SES). Someone inspecting the document may see that it contains non-QES signatures.'
              type: boolean
              x-ms-summary: Exclude verified EID signature
              x-ms-visibility: advanced
          type: object
          x-ms-summary: Recipient settings
          x-ms-visibility: advanced
        signing_methods:
          description: Signing methods used by the recipient
          items:
            $ref: '#/components/schemas/SigningMethod'
          type: array
          x-ms-summary: Signing methods
          x-ms-visibility: advanced
        status:
          description: Status of the recipient
          type: string
          x-ms-summary: Status
        thumb_url:
          description: Thumb URL of the recipient
          type: string
          x-ms-summary: Thumb URL
        title:
          description: Title of the recipient
          type: string
          x-ms-summary: Title
      title: Recipient
      type: object
      x-ms-summary: Recipient
    SigningMethod:
      description: Details about a signing method used by the recipient
      properties:
        signed_at:
          description: ISO 8601 timestamp of when the signing occurred
          type: string
        type:
          description: The type of signing method used
          enum:
          - eid
          - biometric
          - sms
          - initials
          - signature
          type: string
        verified_name:
          description: Name verified from eID transaction
          type: string
        verified_phone:
          description: Phone number used for SMS verification
          type: string
      title: SigningMethod
      type: object
    Document:
      description: A document is one or multiple uploaded file(s) that is to be sent to one or many recipients created by a user.
