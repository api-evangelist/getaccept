api_access_note: >-
  API access is NOT part of the published per-seat pricing. The plan comparison table lists "API read
  access" as an Enterprise-tier feature and "API write access" ("Create and send GetAccept documents from
  external apps and forms using our API") separately. GetAccept's own API page states the API is sold on
  "custom pricing, tailored to your usage" via sales, and the OpenAPI repo README says "commercial usage
  is subject to the purchase of a GetAccept API package." So there is no self-serve, published price for
  API consumption — only the seat plans below plus a quoted API package.
