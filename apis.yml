aid: getaccept
name: GetAccept
description: >-
  GetAccept is a digital sales room and sales enablement platform that helps revenue teams
  design, send, promote, track, and e-sign sales documents in one place — combining sales
  collateral, proposals, contract management, document tracking, and legally binding electronic
  signatures. The GetAccept REST API (v1, base https://api.getaccept.com/v1) exposes 86 operations
  across documents, e-signature, recipients, contacts, templates, users, videos, custom data,
  communication templates, and webhook subscriptions, secured with OAuth2 (authorization code) or
  bearer tokens. GetAccept is backed by Bessemer Venture Partners and Y Combinator.
