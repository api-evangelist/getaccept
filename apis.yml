- aid: getaccept:getaccept-subscriptions-api
  name: GetAccept Subscriptions API
  description: >-
    To simplify the process of checking a documents status and make it more efficient in an integrated
    application, you can enable API Webhooks. Enable webhooks as a user with administrator privileges
    in the Settings | Integration | Webhooks. We support multiple webhooks for one application. Events
    will be POSTed to your webhook URLs and should be handled by you. A POST must be answered and your
    endpoint will need to return a 2xx HTTP. Otherwise, the callback will be considered a failure and
    will be retried later. Retries will be made after 1, 12, 24, and 48 hours. The sender (or notification_email)
    will receive an email notification after a failed attempt.
  humanURL: https://www.getaccept.com/api
  baseURL: https://api.getaccept.com/v1
  tags:
  - Subscription
  tags_raw:
  - Subscriptions
  properties:
  - type: OpenAPI
